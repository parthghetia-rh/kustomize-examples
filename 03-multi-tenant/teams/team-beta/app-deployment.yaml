apiVersion: apps/v1
kind: Deployment
metadata:
  name: beta-ml-pipeline
  namespace: team-beta
  labels:
    app: beta-ml-pipeline
    team: team-beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beta-ml-pipeline
  template:
    metadata:
      labels:
        app: beta-ml-pipeline
        team: team-beta
    spec:
      containers:
        - name: pipeline
          image: registry.example.com/team-beta/ml-pipeline:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
