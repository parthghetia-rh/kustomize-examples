apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: custom-monitoring
spec:
  groups:
    - name: platform.rules
      rules:
        - alert: HighCPUUsage
          expr: |
            100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High CPU usage detected on {{ $labels.instance }}"
            description: >-
              CPU usage on instance {{ $labels.instance }} has been above 80%
              for more than 10 minutes. Current value is {{ $value | printf "%.1f" }}%.

        - alert: HighMemoryUsage
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: >-
              Memory usage on instance {{ $labels.instance }} has been above 85%
              for more than 10 minutes. Current value is {{ $value | printf "%.1f" }}%.

        - alert: PodRestartingTooOften
          expr: |
            rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently"
            description: >-
              Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted
              more than 3 times in the last 15 minutes.

        - alert: DiskUsageCritical
          expr: |
            (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Critical disk usage on {{ $labels.instance }} mount {{ $labels.mountpoint }}"
            description: >-
              Disk usage on {{ $labels.instance }} at mount point {{ $labels.mountpoint }}
              has exceeded 90%. Current value is {{ $value | printf "%.1f" }}%.
              Immediate action required to prevent service disruption.

        - alert: HighCPUUsageCritical
          expr: |
            100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Critical CPU usage on {{ $labels.instance }}"
            description: >-
              CPU usage on instance {{ $labels.instance }} has exceeded 95%
              for more than 5 minutes. Immediate investigation required.
