controller:
  replicaCount: 3

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
