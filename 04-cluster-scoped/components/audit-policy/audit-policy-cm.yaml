apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-policy
  namespace: openshift-config
data:
  policy.yaml: |
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
      - level: None
        users:
          - "system:apiserver"
      - level: None
        nonResourceURLs:
          - /healthz
          - /readyz
      - level: Metadata
        resources:
          - group: ""
            resources:
              - secrets
              - configmaps
      - level: RequestResponse
        resources:
          - group: ""
            resources:
              - "*"
          - group: apps
            resources:
              - "*"
          - group: batch
            resources:
              - "*"
